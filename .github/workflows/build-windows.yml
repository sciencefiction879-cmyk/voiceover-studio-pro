name: Build Windows Executable & Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "assets/**"
      - "requirements.txt"
      - "VoiceoverStudio.spec"
      - "installer.iss"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install pyinstaller pythonnet pywebview[cef] lxml python-docx

      - name: Download Windows FFmpeg and FFprobe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegPath = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          $ffprobePath = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffprobe.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegPath.FullName -Destination "bin\ffmpeg.exe"
          Copy-Item $ffprobePath.FullName -Destination "bin\ffprobe.exe"
          Get-ChildItem -Path bin

      - name: Build Native Windows Executable with PyInstaller
        run: |
          pyinstaller --clean -y VoiceoverStudio.spec

      - name: Build Standalone One-File Executable
        run: |
          pyinstaller --clean -y --onefile --windowed --name VoiceoverStudio-v0.4.4-Windows --icon assets/AppIcon.ico --add-data "frontend;frontend" --add-data "backend;backend" --add-data "bin;bin" --hidden-import flask --hidden-import flask_cors --hidden-import webview --hidden-import numpy --hidden-import werkzeug --hidden-import jinja2 --hidden-import click --hidden-import clr --hidden-import pythonnet backend/desktop_app.py

      - name: Build Inno Setup Installer (Setup Wizard)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          Get-ChildItem -Path dist

      - name: Package Native Windows Portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\VoiceoverStudio\*" -DestinationPath "dist\VoiceoverStudio-Windows-Portable-v0.4.4.zip" -Force
          Get-ChildItem -Path dist

      - name: Publish Built Windows Packages to GitHub Release v0.4.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release upload v0.4.4 dist/VoiceoverStudio-v0.4.4-Setup.exe dist/VoiceoverStudio-v0.4.4-Windows.exe dist/VoiceoverStudio-Windows-Portable-v0.4.4.zip --clobber
